<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login Admin - SMP Setia Negara</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #1b3a6b, #2c3e50);
        }
        .login-container {
            background: white; padding: 40px; border-radius: 12px; width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
        }
        .logo-section img { width: 80px; margin-bottom: 15px; }
        .logo-section h2 { font-size: 20px; color: #1b3a6b; margin-bottom: 5px; }
        .logo-section p { font-size: 13px; color: #7f8c8d; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; position: relative; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; font-weight: 500; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 14px; }
        .form-control { width: 100%; padding: 12px 12px 12px 38px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .form-control:focus { outline: none; border-color: #1b3a6b; box-shadow: 0 0 5px rgba(27,58,107,0.2); }
        
        .btn-login { 
            background-color: #1b3a6b; color: white; border: none; width: 100%; padding: 12px; 
            border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 15px; margin-top: 10px; transition: 0.2s;
        }
        .btn-login:hover { background-color: #29528a; }
        
        .back-to-web { display: inline-block; margin-top: 20px; font-size: 13px; color: #7f8c8d; text-decoration: none; }
        .back-to-web:hover { color: #1b3a6b; text-decoration: underline; }
        
        .error-message { color: #e74c3c; font-size: 13px; margin-bottom: 15px; display: none; text-align: left; background: #fce4e4; padding: 10px; border-radius: 4px; border-left: 4px solid #e74c3c; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-section">
            <img src="/PROJECT KP SETIA NEGARA/asset/icon/logosmp.png" alt="Logo SMP">
            <h2>Sistem Informasi Akademik</h2>
            <p>SMP Setia Negara Depok</p>
        </div>

        <div id="error-box" class="error-message">
            <i class="fas fa-exclamation-circle"></i> Username atau Password salah!
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username Admin</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="off">
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan password" required>
                </div>
            </div>
            <button type="submit" class="btn-login">Masuk ke Ruang Kendali</button>
        </form>

        <a href="/PROJECT-SMP-SETIA-NEGARA-main/PROJECT KP SETIA NEGARA/index.html" class="back-to-web"><i class="fas fa-arrow-left"></i> Kembali ke Web Utama</a>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // Biar gak ngereload page
            
            const userInp = document.getElementById("username").value;
            const passInp = document.getElementById("password").value;
            const errorBox = document.getElementById("error-box");

            // Akun Simulasi untuk Dosen atau Staf TU Sekolah
            if (userInp === "admin" && passInp === "admin123") {
                errorBox.style.display = "none";
                alert("Login Sukses! Selamat datang Admin.");
                window.location.href = "dashboard.html"; // Lempar ke halaman dashboard lu
            } else {
                // Kalau salah, munculin pesan eror merah
                errorBox.style.display = "block";
            }
        }
    </script>

</body>
</html>
